<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FacultyPulse – Set Your Password</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #f4f6f8;
      margin: 0;
    }
    .set-password-box {
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      padding: 32px 28px;
      max-width: 380px;
      width: 90vw;
    }
    .set-password-box h2 {
      margin: 0 0 6px;
      font-size: 20px;
    }
    .set-password-box .subtitle {
      font-size: 13px;
      color: #64748b;
      margin: 0 0 20px;
      line-height: 1.5;
    }
    #status {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 12px;
      line-height: 1.5;
    }
    #set-password-form button {
      width: 100%;
      margin-top: 6px;
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="set-password-box">
    <h2>Set Your Password</h2>
    <p class="subtitle">
      Choose a password only you know. This replaces any temporary or
      previous password on your account.
    </p>

    <p id="status">Verifying your link…</p>

    <form id="set-password-form" class="hidden">
      <div class="form-group">
        <label>New Password</label>
        <input type="password" id="new-password" placeholder="At least 8 characters" autocomplete="new-password" />
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="confirm-password" placeholder="Type it again" autocomplete="new-password" />
      </div>
      <p id="form-error" class="error"></p>
      <button id="submit-btn" type="submit">Set Password</button>
    </form>

    <a class="back-link" href="index.html">Back to login</a>
  </div>

  <script type="module" src="js/set-password.js"></script>
</body>
</html>
